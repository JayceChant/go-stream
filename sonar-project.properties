# SonarCloud 项目配置：组织/项目 key 由 SonarCloud GitHub 导入流程生成
sonar.projectKey=JayceChant_go-stream
sonar.organization=jaycechant

# 源码与测试划分
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/vendor/**

# 覆盖率导入（CI 中 go test -coverprofile 产物）
sonar.go.coverage.reportPaths=coverage.txt
